<fieldset>
    <legend>Calculator</legend>
    <div>
        <label for="radioAdd">Add: &nbsp;</label>
        <input type="radio" name="calc" id="radioAdd" (change)="choice.set(1)">
        &nbsp;&nbsp;&nbsp;&nbsp;
        <label for="radioSub">Subtract: &nbsp;</label>
        <input type="radio" name="calc" id="radioSub" (change)="choice.set(2)">
        &nbsp;&nbsp;&nbsp;&nbsp;
        <label for="radioMulti">Multiply: &nbsp;</label>
        <input type="radio" name="calc" id="radioMulti" (change)="choice.set(3)">
        &nbsp;&nbsp;&nbsp;&nbsp;
        <label for="radioDiv">Divide: &nbsp;</label>
        <input type="radio" name="calc" id="radioDiv" (change)="choice.set(4)">
    </div>
    <div>
        <label for="txtFirst">First: &nbsp;</label>
        <input type="text" id="txtFirst" [value]="first()" (input)="first.set(+$event.target.value)">
    </div>
    <div>
        <label for="txtSecond">Second: &nbsp;</label>
        <input type="text" id="txtSecond" (input)="second.set(+$event.target.value)" [value]="second()">
    </div>
    <div>
        <button type="button" (click)="calculate()">Calculate</button>
    </div>
    <div>
        <label for="txtResult">Result: &nbsp;</label>
        <input type="text" id="txtResult" readonly [value]="result()">
    </div>
</fieldset>
