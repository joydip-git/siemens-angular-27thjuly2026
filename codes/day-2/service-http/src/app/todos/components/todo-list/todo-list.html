<table>
    <thead>
        <tr>
            <th>Id</th>
            <th>Assigned To</th>
            <th>Title</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody>
        @for (todo of todos(); track $index) {
        <tr>
            <td>{{todo.id}}</td>
            <td>{{todo.userId}}</td>
            <td>{{todo.title}}</td>
            <td>{{todo.completed?'Done':'Pending'}}</td>
        </tr>
        }
    </tbody>
</table>
