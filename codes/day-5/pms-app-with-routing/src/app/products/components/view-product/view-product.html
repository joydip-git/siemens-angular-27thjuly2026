@if(!isRequestOver()){
<app-spinner></app-spinner>
}
@else if (errorInfo()!=='') {
<span>{{errorInfo()}}</span>
}@else if(!product()){
<span>No product found</span>
}@else {
<div>
    <span>Details of {{product()?.productName}}</span>
    <br>
    <button type="button" class="btn btn-primary" (click)="gotoEdit()">Edit</button>
</div>
}
